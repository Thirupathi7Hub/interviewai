services:
  # ── Backend (Node/Express) ──────────────────────────────────────────────────
  - type: web
    name: interviewai-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        sync: false          # set manually in Render dashboard
      - key: SESSION_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false          # e.g. https://interviewai-backend.onrender.com/auth/google/callback
      - key: CLIENT_URL
        sync: false          # e.g. https://interviewai.onrender.com

  # ── Frontend (Vite Static Site) ─────────────────────────────────────────────
  - type: web
    name: interviewai-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false          # e.g. https://interviewai-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
